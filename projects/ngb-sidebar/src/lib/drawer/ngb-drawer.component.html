@if (rendered()) {
  <div #root class="ngb-drawer-root">
    @if (modal()) {
      <div
        class="ngb-drawer-mask"
        [class.ngb-drawer-mask-active]="active()"
        [ngClass]="maskStyleClass()"
        [style.z-index]="maskZIndex()"
        [style.transition-duration.ms]="transitionDuration()"
        (click)="onMaskClick()"
      ></div>
    }
    <div
      #container
      class="ngb-drawer"
      [id]="id"
      [ngClass]="panelClasses()"
      [ngStyle]="panelStyle()"
      [style.z-index]="zIndex()"
      role="dialog"
      [attr.aria-modal]="modal()"
      [attr.aria-label]="ariaLabel() ?? null"
      [attr.aria-labelledby]="labelledBy()"
      tabindex="-1"
    >
      @if (headlessTpl(); as headless) {
        <ng-container *ngTemplateOutlet="headless.templateRef; context: tplContext"></ng-container>
      } @else {
        <div class="ngb-drawer-header">
          <div class="ngb-drawer-title" [id]="headerId">
            @if (headerTpl(); as h) {
              <ng-container *ngTemplateOutlet="h.templateRef; context: tplContext"></ng-container>
            } @else if (header()) {
              <h5 class="m-0">{{ header() }}</h5>
            }
          </div>
          @if (showCloseIcon() && closable()) {
            <button
              type="button"
              class="ngb-drawer-close"
              [attr.aria-label]="ariaCloseLabel()"
              (click)="close('close-button')"
            >
              @if (closeIconTpl(); as ci) {
                <ng-container
                  *ngTemplateOutlet="ci.templateRef; context: tplContext"
                ></ng-container>
              } @else if (closeIcon()) {
                <i [class]="closeIcon()" aria-hidden="true"></i>
              } @else {
                <span class="btn-close" aria-hidden="true"></span>
              }
            </button>
          }
        </div>
        <div class="ngb-drawer-content">
          <ng-content></ng-content>
          @if (contentTpl(); as c) {
            <ng-container *ngTemplateOutlet="c.templateRef; context: tplContext"></ng-container>
          }
        </div>
        @if (footerTpl(); as f) {
          <div class="ngb-drawer-footer">
            <ng-container *ngTemplateOutlet="f.templateRef; context: tplContext"></ng-container>
          </div>
        }
      }
    </div>
  </div>
}
